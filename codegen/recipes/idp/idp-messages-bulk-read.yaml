# Generation input for `idp messages bulk-read`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PatchV1MessagesBulkRead
command:
  path:
    - idp
    - messages
    - bulk-read
  file: messages.go
  var: messagesBulkReadCommand
  short: Bulk-update the read status of multiple messages by ID
args:
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Ids
      name: ids
      cli: ids
      var: ids
      type: '[]string'
      description: IDs of the messages to update
      resolve:
        - flag
        - prompt
      prompt: ids
    - field: Read
      name: read
      cli: read
      var: read
      type: bool
      description: Read status to apply to all specified messages
      resolve:
        - flag
        - prompt
      prompt: read
response:
  render: body
