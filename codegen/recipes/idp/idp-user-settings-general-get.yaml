# Generation input for `idp user settings general get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1UserSettingsGeneral
command:
  path:
    - idp
    - user
    - settings
    - general
    - get
  file: settings.go
  var: userSettingsGeneralGetCommand
  short: Get the current general settings of the logged in user
args:
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
