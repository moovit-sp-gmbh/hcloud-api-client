# Generation input for `idp organization stats`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgNameStats
command:
  path:
    - idp
    - organization
    - stats
  file: stats.go
  var: organizationStatsCommand
  short: Retrieve usage statistics for a specific organization
  long: |-
    Provides detailed license usage metrics for a given organization
    Required scopes: IDP_ORGANIZATION_READ
    Required role: ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
