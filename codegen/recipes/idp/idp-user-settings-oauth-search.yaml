# Generation input for `idp user settings oauth search`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1UserSettingsOauthSearch
command:
  path:
    - idp
    - user
    - settings
    - oauth
    - search
  file: user-settings-oauth.go
  var: userSettingsOauthSearchCommand
  short: Search all oAuthApps of the current user using search filters
  long: 'Required scopes: IDP_ORGANIZATION_ADMIN'
args:
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
