# Generation input for `idp user settings general last-visit`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PatchV1UserSettingsGeneralLastVisit
command:
  path:
    - idp
    - user
    - settings
    - general
    - last-visit
  file: user-settings-general.go
  var: userSettingsGeneralLastVisitCommand
  short: Patch the last view and / or last URL of the logged in user
args:
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: LastUrl
      name: lastUrl
      cli: lastUrl
      var: lastUrl
      type: '*string'
      description: Last URL visited by the user
      optional: true
      unset: omit
      resolve:
        - flag
    - field: LastView
      name: lastView
      cli: lastView
      var: lastView
      type: '*Views'
      description: Last view the user was in
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
  field: JSON200
