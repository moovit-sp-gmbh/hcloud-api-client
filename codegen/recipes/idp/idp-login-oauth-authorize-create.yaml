# Generation input for `idp login oauth authorize create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1LoginOauthAuthorize
command:
  path:
    - idp
    - login
    - oauth
    - authorize
    - create
  file: login-oauth-authorize.go
  var: loginOauthAuthorizeCreateCommand
  short: OAuth Authorization Endpoint
  long: |-
    Request access code for the user
    Required scopes: HCLOUD_FULL
args:
  - source: query
    name: response_type
    goName: ResponseType
    cli: response_type
    var: responseType
    type: '*string'
    description: Tells the authorization server which grant to execute. Currently only "code" is supported
    unset: omit
    resolve:
      - flag
  - source: query
    name: client_id
    goName: ClientId
    cli: client_id
    var: clientId
    type: string
    description: The ID of the application that is asking for authorization
    resolve:
      - flag
      - prompt
    prompt: client_id
  - source: query
    name: redirect_uri
    goName: RedirectUri
    cli: redirect_uri
    var: redirectUri
    type: string
    description: A successful response will redirect to this URI
    resolve:
      - flag
      - prompt
    prompt: redirect_uri
  - source: query
    name: scope
    goName: Scope
    cli: scope
    var: scope
    type: string
    description: Space-delimited list of hcloud permissions that the application requires as well as openId if required
    resolve:
      - flag
      - prompt
    prompt: scope
  - source: query
    name: state
    goName: State
    cli: state
    var: state
    type: '*string'
    description: Optional value, used for security purposes (XSRF) or to store non-sensitive information between requests. If this request parameter is set in the request, then it is returned to the application as part of the redirect_uri with no changes
    unset: omit
    resolve:
      - flag
  - source: query
    name: code_challenge
    goName: CodeChallenge
    cli: code_challenge
    var: codeChallenge
    type: '*string'
    description: Optional value, used for PKCE (https://www.rfc-editor.org/rfc/rfc7636#section-4)
    unset: omit
    resolve:
      - flag
  - source: query
    name: code_challenge_method
    goName: CodeChallengeMethod
    cli: code_challenge_method
    var: codeChallengeMethod
    type: '*PostV1LoginOauthAuthorizeParamsCodeChallengeMethod'
    description: Optional value, used for PKCE (https://www.rfc-editor.org/rfc/rfc7636#section-4)
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
