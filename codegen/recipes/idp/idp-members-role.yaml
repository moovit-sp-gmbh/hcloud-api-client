# Generation input for `idp members role`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PatchV1OrgOrgNameMembersUserIdRole
command:
  path:
    - idp
    - members
    - role
  file: members.go
  var: membersRoleCommand
  short: Patch an organization member's role in the Organization
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_WRITE
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: userId
    goName: userId
    cli: userId
    var: userId
    type: string
    resolve:
      - flag
      - prompt
    prompt: userId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Role
      name: role
      cli: role
      var: role
      type: OrgMemberPatchDtoRole
      resolve:
        - flag
        - prompt
      prompt: role
response:
  render: body
  field: JSON200
