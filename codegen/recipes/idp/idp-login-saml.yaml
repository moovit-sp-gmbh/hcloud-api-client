# Generation input for `idp login saml`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1LoginSaml
command:
  path:
    - idp
    - login
    - saml
  file: saml.go
  var: loginSamlCommand
  short: Start the login process using the SAML2.0 protocol
args:
  - source: query
    name: origin
    goName: Origin
    cli: origin
    var: origin
    type: string
    description: A URL marking the starting point of the login process. At the end the user will be redirected back to this URL with token=<JWT> added to the query string
    resolve:
      - flag
      - prompt
    prompt: origin
  - source: query
    name: email
    goName: Email
    cli: email
    var: email
    type: openapi_types.Email
    description: The user's email. The email domain will be used to determine the appropriate SAML 2.0 provider to use going forward
    resolve:
      - flag
      - context
      - prompt
    context: Email
    persist: true
    prompt: email
body:
  mode: none
response:
  render: body
