# Generation input for `idp settings applications oauth search`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1OrgOrgNameSettingsApplicationsOauthSearch
command:
  path:
    - idp
    - settings
    - applications
    - oauth
    - search
  file: settings-applications-oauth.go
  var: settingsApplicationsOauthSearchCommand
  short: Search oAuthApps of the active organization
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
