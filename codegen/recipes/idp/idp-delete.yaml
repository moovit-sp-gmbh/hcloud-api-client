# Generation input for `idp delete`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: DeleteV1OrgOrgName
command:
  path:
    - idp
    - delete
  file: delete.go
  var: deleteCommand
  short: Delete Organization by name
  long: |-
    Required role: OWNER
    Required scopes: IDP_ORGANIZATION_DELETE
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
