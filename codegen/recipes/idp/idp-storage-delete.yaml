# Generation input for `idp storage delete`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: DeleteV1OrgOrgNameStorageStorageId
command:
  path:
    - idp
    - storage
    - delete
  file: storage.go
  var: storageDeleteCommand
  short: Delete storage
  long: 'Required scopes: IDP_ORGANIZATION_WRITE'
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: storageId
    goName: storageId
    cli: storageId
    var: storageId
    type: TheIdOfTheStorageToDelete
    resolve:
      - flag
      - context
      - prompt
    context: StorageID
    persist: true
    prompt: storageId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
