# Generation input for `idp user password reset`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1UserPasswordReset
command:
  path:
    - idp
    - user
    - password
    - reset
  file: user-password.go
  var: userPasswordResetCommand
  short: Reset a user's password
body:
  mode: typed
  fields:
    - field: Email
      name: email
      cli: email
      var: email
      type: openapi_types.Email
      description: Email of the user
      resolve:
        - flag
        - context
        - prompt
      context: Email
      prompt: email
    - field: NewPassword
      name: newPassword
      cli: newPassword
      var: newPassword
      type: string
      description: New password
      resolve:
        - flag
        - prompt
      prompt: newPassword
    - field: Nonce
      name: nonce
      cli: nonce
      var: nonce
      type: string
      description: Nonce generated in the 1st phase of the password reset process.
      resolve:
        - flag
        - prompt
      prompt: nonce
    - field: TotpToken
      name: totpToken
      cli: totpToken
      var: totpToken
      type: '*string'
      description: TOTP token. Required only if the user has 2FA enabled.
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
  field: JSON200
