# Generation input for `idp organization license get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgNameLicense
command:
  path:
    - idp
    - organization
    - license
    - get
  file: license.go
  var: organizationLicenseGetCommand
  short: Get the current license applied to the organization
  long: |2-
    Required role: MEMBER
    Required scopes: IDP_ORGANIZATION_READ
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
