# Generation input for `idp login saml assert`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1LoginSamlAssert
command:
  path:
    - idp
    - login
    - saml
    - assert
  file: login-saml.go
  var: loginSamlAssertCommand
  short: Callback URL for the login process using the SAML2.0 protocol
  long: It is required that the HTTP Post SAML binding be used in this operation. <a href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML 2.0 Bindings (Section 3.5)</a>
body:
  mode: typed
  fields:
    - field: RelayState
      name: RelayState
      cli: RelayState
      var: relayState
      type: string
      description: State value forwarded by the SAML IdP
      resolve:
        - flag
        - prompt
      prompt: RelayState
    - field: SAMLResponse
      name: SAMLResponse
      cli: SAMLResponse
      var: sAMLResponse
      type: string
      description: Base64 URL encoded XML string containing the response as per the <a href="https://docs.oasis-open.org/security/saml/v2.0/saml-bindings-2.0-os.pdf">SAML 2.0 HTTP POST binding (Section 3.5)</a>
      resolve:
        - flag
        - prompt
      prompt: SAMLResponse
response:
  render: body
