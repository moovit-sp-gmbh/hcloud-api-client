# Generation input for `idp settings applications oauth secret`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1OrgOrgNameSettingsApplicationsOauthOAuthAppIdSecret
command:
  path:
    - idp
    - settings
    - applications
    - oauth
    - secret
  file: settings-applications-oauth.go
  var: settingsApplicationsOauthSecretCommand
  short: Creates a new secret inside an existing oAuthApp
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: oAuthAppId
    goName: oAuthAppId
    cli: oAuthAppId
    var: oAuthAppId
    type: string
    resolve:
      - flag
      - context
      - prompt
    context: OauthAppID
    persist: true
    prompt: oAuthAppId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: SecretName
      name: secretName
      cli: secretName
      var: secretName
      type: string
      description: Name of the secret (only alphanumeric, underscores, hyphens and dots are allowed; it should contain between 1 and 255 characters)
      resolve:
        - flag
        - prompt
      prompt: secretName
response:
  render: body
  field: JSON201
