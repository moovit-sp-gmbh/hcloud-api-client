# Generation input for `idp login forgot-password`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1LoginForgotPassword
command:
  path:
    - idp
    - login
    - forgot-password
  file: login.go
  var: loginForgotPasswordCommand
  short: Initiate the password reset process. An email will be sent to the user to move to the next phase
body:
  mode: typed
  fields:
    - field: Captcha
      name: captcha
      cli: captcha
      var: captcha
      type: string
      description: Valid google reCAPTCHAV2
      resolve:
        - flag
        - prompt
      prompt: captcha
    - field: Email
      name: email
      cli: email
      var: email
      type: openapi_types.Email
      description: Email of the user that forgot their password
      resolve:
        - flag
        - context
        - prompt
      context: Email
      prompt: email
    - field: TargetUrl
      name: targetUrl
      cli: targetUrl
      var: targetUrl
      type: '*string'
      description: URL create the redirect link in the email. It will default to https://app.helmut.cloud
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
