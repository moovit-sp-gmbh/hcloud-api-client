# Generation input for `idp organization get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgName
command:
  path:
    - idp
    - organization
    - get
  file: organization.go
  var: organizationGetCommand
  short: Retrieves an organization by it's name
  long: |2-
    Required role: MEMBER
    Required scopes: IDP_ORGANIZATION_READ
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: query
    name: teamsOfUser
    goName: TeamsOfUser
    cli: teamsOfUser
    var: teamsOfUser
    type: '*bool'
    description: If true, an additional property holding all teams that the requesting user is part of and that belong to the organization will be returned
    unset: omit
    resolve:
      - flag
  - source: query
    name: totalMemberCount
    goName: TotalMemberCount
    cli: totalMemberCount
    var: totalMemberCount
    type: '*bool'
    description: If true, an additional property holding the total member count of the organization will be returned
    unset: omit
    resolve:
      - flag
  - source: query
    name: membersSample
    goName: MembersSample
    cli: membersSample
    var: membersSample
    type: '*float32'
    description: If set, an additional property holding a sample of members will be returned. The provided number represents the max. size of the sample
    unset: omit
    resolve:
      - flag
  - source: query
    name: license
    goName: License
    cli: license
    var: license
    type: '*bool'
    description: If set, an additional property holding the organization's license will be included
    unset: omit
    resolve:
      - flag
  - source: query
    name: userId
    goName: UserId
    cli: userId
    var: userId
    type: '*string'
    description: If set, the organization role included in the response will of this user instead of the one associated with the token used in the request
    unset: omit
    resolve:
      - flag
    skip: true
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
