# Generation input for `idp settings applications oauth delete`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: DeleteV1OrgOrgNameSettingsApplicationsOauthOAuthAppId
command:
  path:
    - idp
    - settings
    - applications
    - oauth
    - delete
  file: settings-applications-oauth.go
  var: settingsApplicationsOauthDeleteCommand
  short: Delete OAuthApp
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: oAuthAppId
    goName: oAuthAppId
    cli: oAuthAppId
    var: oAuthAppId
    type: string
    resolve:
      - flag
      - context
      - prompt
    context: OauthAppID
    persist: true
    prompt: oAuthAppId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
