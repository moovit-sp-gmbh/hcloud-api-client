# Generation input for `idp service-accounts create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1OrgOrgNameServiceAccounts
command:
  path:
    - idp
    - service-accounts
    - create
  file: service-accounts.go
  var: serviceAccountsCreateCommand
  short: Create a new service account
  long: |-
    Required organization role: ADMIN
    Required scopes: IDP_ORGANIZATION_WRITE
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: query
    name: noAvatar
    goName: NoAvatar
    cli: noAvatar
    var: noAvatar
    type: '*bool'
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Service account name
      resolve:
        - flag
        - prompt
      prompt: name
response:
  render: body
  field: JSON201
