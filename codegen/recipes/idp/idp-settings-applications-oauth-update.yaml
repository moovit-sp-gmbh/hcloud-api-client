# Generation input for `idp settings applications oauth update`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PutV1OrgOrgNameSettingsApplicationsOauthOAuthAppId
command:
  path:
    - idp
    - settings
    - applications
    - oauth
    - update
  file: settings-applications-oauth.go
  var: settingsApplicationsOauthUpdateCommand
  short: Update an oAuthApp by its ID
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: oAuthAppId
    goName: oAuthAppId
    cli: oAuthAppId
    var: oAuthAppId
    type: string
    resolve:
      - flag
      - context
      - prompt
    context: OauthAppID
    persist: true
    prompt: oAuthAppId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: AllowAuthorizationCodeFlow
      name: allowAuthorizationCodeFlow
      cli: allowAuthorizationCodeFlow
      var: allowAuthorizationCodeFlow
      type: '*bool'
      description: Set to true to allow authorization code flow through this application
      optional: true
      unset: omit
      resolve:
        - flag
    - field: AllowDeviceFlow
      name: allowDeviceFlow
      cli: allowDeviceFlow
      var: allowDeviceFlow
      type: '*bool'
      description: Set to true to allow device flow through this application
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Callback
      name: callback
      cli: callback
      var: callback
      type: '[]string'
      description: Callback URI for the OAuthApp
      resolve:
        - flag
        - prompt
      prompt: callback
    - field: Description
      name: description
      cli: description
      var: description
      type: '*string'
      description: Optional description of the OAuthApp
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Homepage
      name: homepage
      cli: homepage
      var: homepage
      type: '*string'
      description: Optional homepage URL for the OAuthApp
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Name of the OAuthApp
      resolve:
        - flag
        - prompt
      prompt: name
response:
  render: body
  field: JSON200
