# Generation input for `idp organization settings oauth get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgNameSettingsApplicationsOauthOAuthAppId
command:
  path:
    - idp
    - organization
    - settings
    - oauth
    - get
  file: oauth.go
  var: organizationSettingsOauthGetCommand
  short: Retrieves an organization's oAuthApp by its ID
  long: |2-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: path
    name: oAuthAppId
    goName: oAuthAppId
    cli: oAuthAppId
    var: oAuthAppId
    type: string
    resolve:
      - flag
      - context
      - prompt
    context: OauthAppID
    persist: true
    prompt: OAuth application ID
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
