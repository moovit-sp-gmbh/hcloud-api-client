# Generation input for `idp settings domains oidc patch`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PatchV1OrgOrgNameSettingsDomainsDomainNameOidc
command:
  path:
    - idp
    - settings
    - domains
    - oidc
    - patch
  file: settings-domains-oidc.go
  var: settingsDomainsOidcPatchCommand
  short: Edit the current configuration of the OIDC provider linked with a domain
  long: 'Required organization role: ADMIN'
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: domainName
    goName: domainName
    cli: domainName
    var: domainName
    type: string
    resolve:
      - flag
      - prompt
    prompt: domainName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: ClientId
      name: clientId
      cli: clientId
      var: clientId
      type: '*string'
      optional: true
      unset: omit
      resolve:
        - flag
    - field: ClientSecret
      name: clientSecret
      cli: clientSecret
      var: clientSecret
      type: '*string'
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
  field: JSON200
