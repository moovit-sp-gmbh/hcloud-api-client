# Generation input for `idp settings domains oidc create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: PostV1OrgOrgNameSettingsDomainsDomainNameOidc
command:
  path:
    - idp
    - settings
    - domains
    - oidc
    - create
  file: settings-domains-oidc.go
  var: settingsDomainsOidcCreateCommand
  short: Creates a new provider for the specified domain in an organization
  long: |-
    Creates a new provider for the specified domain in an organization
    There are multiple ways the process can fail besides authentication/authorization:
    - The domain is not verified
    - There is already an IdP associated with this organization and domain

    Required organization role: ADMIN
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: domainName
    goName: domainName
    cli: domainName
    var: domainName
    type: string
    resolve:
      - flag
      - prompt
    prompt: domainName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: ClientId
      name: clientId
      cli: clientId
      var: clientId
      type: string
      resolve:
        - flag
        - prompt
      prompt: clientId
    - field: ClientSecret
      name: clientSecret
      cli: clientSecret
      var: clientSecret
      type: string
      resolve:
        - flag
        - prompt
      prompt: clientSecret
response:
  render: body
  field: JSON201
