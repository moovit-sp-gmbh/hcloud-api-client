# Generation input for `idp organization teams get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgNameTeamsTeamName
command:
  path:
    - idp
    - organization
    - teams
    - get
  file: teams.go
  var: organizationTeamsGetCommand
  short: Get a team by its name
  long: |2-
    Required role: MEMBER
    Required scopes: IDP_ORGANIZATION_READ
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: path
    name: teamName
    goName: teamName
    cli: teamName
    var: teamName
    type: string
    description: Name of the team (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: TeamName
    persist: true
    prompt: team name
  - source: query
    name: membersLimit
    goName: MembersLimit
    cli: membersLimit
    var: membersLimit
    type: '*float32'
    description: Max number ob members that shall be returned in the team object. If not defined, no members will be returned
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
