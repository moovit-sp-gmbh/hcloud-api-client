# Generation input for `idp service-accounts delete`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: DeleteV1OrgOrgNameServiceAccountsServiceAccountId
command:
  path:
    - idp
    - service-accounts
    - delete
  file: service-accounts.go
  var: serviceAccountsDeleteCommand
  short: Delete service account
  long: |-
    Required organization role: ADMIN
    Required scopes: IDP_ORGANIZATION_WRITE
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: serviceAccountId
    goName: serviceAccountId
    cli: serviceAccountId
    var: serviceAccountId
    type: string
    description: ID of the service account
    resolve:
      - flag
      - prompt
    prompt: serviceAccountId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
