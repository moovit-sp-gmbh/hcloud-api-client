# Generation input for `idp members delete`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: DeleteV1OrgOrgNameMembersUserId
command:
  path:
    - idp
    - members
    - delete
  file: members.go
  var: membersDeleteCommand
  short: Remove a user from an organization by the organization user ID
  long: |-
    Required role: ADMIN
    Required scopes: IDP_ORGANIZATION_WRITE
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: userId
    goName: userId
    cli: userId
    var: userId
    type: string
    resolve:
      - flag
      - prompt
    prompt: userId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
