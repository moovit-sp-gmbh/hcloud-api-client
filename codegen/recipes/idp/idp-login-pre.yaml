# Generation input for `idp login pre`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1LoginPre
command:
  path:
    - idp
    - login
    - pre
  file: login.go
  var: loginPreCommand
  short: Endpoint to get the way to proceed with the authentication
args:
  - source: query
    name: email
    goName: Email
    cli: email
    var: email
    type: openapi_types.Email
    description: Email of the user
    resolve:
      - flag
      - context
      - prompt
    context: Email
    persist: true
    prompt: email
  - source: query
    name: origin
    goName: Origin
    cli: origin
    var: origin
    type: string
    description: Origin of the request. Used when the response path is EXTERNAL
    resolve:
      - flag
      - prompt
    prompt: origin
  - source: query
    name: redirect
    goName: Redirect
    cli: redirect
    var: redirect
    type: '*GetV1LoginPreParamsRedirect'
    description: Whether or not redirect in the response. If true the response status code can be 302
    default: "false"
    unset: default
    resolve:
      - flag
body:
  mode: none
response:
  render: body
  field: JSON200
