# Generation input for `idp organization service-accounts get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: idpClient
operation: GetV1OrgOrgNameServiceAccountsServiceAccountId
command:
  path:
    - idp
    - organization
    - service-accounts
    - get
  file: serviceAccounts.go
  var: organizationServiceAccountsGetCommand
  short: Get a service account by its ID
  long: |2-
    Required organization role: ADMIN
    Required scopes: IDP_ORGANIZATION_READ
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: path
    name: serviceAccountId
    goName: serviceAccountId
    cli: serviceAccountId
    var: serviceAccountId
    type: string
    description: ID of the service account
    resolve:
      - flag
      - prompt
    prompt: service account ID
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
