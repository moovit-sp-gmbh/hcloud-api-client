# Generation input for `dali avatar create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: daliClient
operation: PostV1AvatarOrgOrgName
command:
  path:
    - dali
    - avatar
    - create
  file: avatar.go
  var: avatarCreateCommand
  short: Create a new Avatar for organization
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: none
response:
  render: body
  field: JSON201
