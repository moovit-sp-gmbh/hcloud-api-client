# Generation input for `dali avatar teams create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: daliClient
operation: PostV1AvatarOrgOrgNameTeamsTeamName
command:
  path:
    - dali
    - avatar
    - teams
    - create
  file: avatar-teams.go
  var: avatarTeamsCreateCommand
  short: Create a new avatar for the team
args:
