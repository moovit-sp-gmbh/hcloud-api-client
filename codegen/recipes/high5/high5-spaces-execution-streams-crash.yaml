# Generation input for `high5 spaces execution streams crash`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameExecutionStreamsStreamSecretCrash
command:
  path:
    - high5
    - spaces
    - execution
    - streams
    - crash
  file: spaces-execution-streams.go
  var: spacesExecutionStreamsCrashCommand
  short: Mark a stream has failed with an optional message
  long: Mark a stream has failed with a message. To be used on for some reason regular logging is not possible
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: streamSecret
    goName: streamSecret
    cli: streamSecret
    var: streamSecret
    type: string
    description: Secret that got generated on execution package creation at one of the POST execute endpoints (it should contain between 3 and 1024 characters)
    resolve:
      - flag
      - prompt
    prompt: streamSecret
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Message
      name: message
      cli: message
      var: message
      type: '*string'
      description: Crash log
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
