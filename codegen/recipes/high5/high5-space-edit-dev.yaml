# Generation input for `high5 space edit dev`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameDev
command:
  path:
    - high5
    - space
    - edit
    - dev
  file: dev.go
  var: spaceEditDevCommand
  short: Edit the enable dev flag on a space
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: organization name
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space
    resolve:
      - flag
      - context
      - prompt
    context: High5SpaceName
    persist: true
    prompt: space name
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: EnableDev
      name: enableDev
      cli: enableDev
      var: enableDev
      type: bool
      description: Specifies to the front-end whether to display the versions under development of Wave Engines and Node Catalogs
      resolve:
        - flag
        - prompt
      prompt: enableDev
response:
  render: body
  field: JSON200
