# Generation input for `high5 spaces webhooks logs`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: GetV1OrgOrgNameSpacesSpaceNameWebhooksWebhookIdLogs
command:
  path:
    - high5
    - spaces
    - webhooks
    - logs
  file: spaces-webhooks.go
  var: spacesWebhooksLogsCommand
  short: Search for webhook logs by webhook id
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: webhookId
    goName: webhookId
    cli: webhookId
    var: webhookId
    type: string
    resolve:
      - flag
      - prompt
    prompt: webhookId
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: none
response:
  render: body
  field: JSON200
