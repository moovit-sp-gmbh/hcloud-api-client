# Generation input for `high5 spaces databases documents push`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameDatabasesDbNameDocumentsKeyPush
command:
  path:
    - high5
    - spaces
    - databases
    - documents
    - push
  file: spaces-databases-documents.go
  var: spacesDatabasesDocumentsPushCommand
  short: Add one or more elements to the end of an array
  long: Appends one or more elements to the end of an array document and returns the updated document
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: dbName
    goName: dbName
    cli: dbName
    var: dbName
    type: string
    description: Name of the database (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: dbName
  - source: path
    name: key
    goName: key
    cli: key
    var: key
    type: string
    description: Key of the document (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 64 characters)
    resolve:
      - flag
      - prompt
    prompt: key
body:
  mode: typed
  fields:
    - field: Ttl
      name: ttl
      cli: ttl
      var: ttl
      type: '*int'
      description: Time-to-live in seconds (undefined if missing)
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Value
      name: value
      cli: value
      var: value
      type: interface{}
      description: Document value - data type must match the type specified in the type field of the existing document - for type NUMBER, it must be number; for type STRING, it must be string; for type BOOLEAN, it must be boolean; for type NUMBER_LIST, it must be Array<number>; for type STRING_LIST, it must be Array<string>; for type BOOLEAN_LIST, it must be Array<boolean>; for type mixed ARRAY, it must be Array<any>; for type OBJECT, it must be object
      optional: true
      unset: omit
      resolve:
        - flag
      skip: true
response:
  render: body
  field: JSON200
