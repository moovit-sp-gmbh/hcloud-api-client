# Generation input for `high5 spaces jobs search`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameJobsSearch
command:
  path:
    - high5
    - spaces
    - jobs
    - search
  file: spaces-jobs.go
  var: spacesJobsSearchCommand
  short: Retrieves all cronjobs that match the provided search filter. Will return all cronjobs of the specified space if no search filter is provided
  long: Returns a paginated list of cronjobs within the specified space that match the provided search filter, returning all cronjobs of the space if no filter is given
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: query
    name: nextExecution
    goName: NextExecution
    cli: nextExecution
    var: nextExecution
    type: '*bool'
    description: Alongside the cronjob also retrieve the timestamps for three next executions (for the specified timezone, in milliseconds)
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
