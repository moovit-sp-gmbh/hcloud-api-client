# Generation input for `high5 spaces databases documents get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: GetV1OrgOrgNameSpacesSpaceNameDatabasesDbNameDocumentsKey
command:
  path:
    - high5
    - spaces
    - databases
    - documents
    - get
  file: spaces-databases-documents.go
  var: spacesDatabasesDocumentsGetCommand
  short: Get document by its key
  long: Returns a single document identified by its key within the specified database. For ARRAY-type documents, the full array items are collected and included in the response value
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: dbName
    goName: dbName
    cli: dbName
    var: dbName
    type: string
    description: Name of the database (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: dbName
  - source: path
    name: key
    goName: key
    cli: key
    var: key
    type: string
    description: Key of the document (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 64 characters)
    resolve:
      - flag
      - prompt
    prompt: key
body:
  mode: none
response:
  render: body
  field: JSON200
