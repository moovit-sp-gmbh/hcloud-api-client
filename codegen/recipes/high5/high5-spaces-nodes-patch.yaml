    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: nodeId
    goName: nodeId
    cli: nodeId
    var: nodeId
    type: string
    resolve:
      - flag
      - prompt
    prompt: nodeId
  - source: query
    name: regenerateSecret
    goName: RegenerateSecret
    cli: regenerateSecret
    var: regenerateSecret
    type: '*bool'
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Specification
      name: specification
      cli: specification
      var: specification
      type: '*string'
      description: The specification of the node as a base64 string
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Typescript
      name: typescript
      cli: typescript
      var: typescript
      type: '*string'
      description: The typescript code content as a base64 string
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
  field: JSON200
