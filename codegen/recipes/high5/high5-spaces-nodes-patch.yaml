# Generation input for `high5 spaces nodes patch`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameNodesNodeId
command:
  path:
    - high5
    - spaces
    - nodes
    - patch
  file: spaces-nodes.go
  var: spacesNodesPatchCommand
  short: Update a node by it's ID
args:
