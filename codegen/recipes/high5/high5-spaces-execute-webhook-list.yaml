      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: webhookToken
    goName: webhookToken
    cli: webhookToken
    var: webhookToken
    type: string
    description: Last path segment of the webhook URL (128 char long hex string)
    resolve:
      - flag
      - prompt
    prompt: webhookToken
  - source: query
    name: challenge
    goName: Challenge
    cli: challenge
    var: challenge
    type: '*string'
    description: Some third party services require to validate the target URL of a webhook first. To do so, they sent an initial GET request with a query-string called 'challenge' (only alphanumeric characters, underscores and hyphens are allowed; it should contain between 1 and 128 characters)
