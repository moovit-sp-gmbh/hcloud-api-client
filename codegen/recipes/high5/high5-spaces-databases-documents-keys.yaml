# Generation input for `high5 spaces databases documents keys`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameDatabasesDbNameDocumentsKeyKeys
command:
  path:
    - high5
    - spaces
    - databases
    - documents
    - keys
  file: spaces-databases-documents.go
  var: spacesDatabasesDocumentsKeysCommand
  short: Remove one or more keys from an object document
  long: Removes one or more specified keys from an object document without affecting the remaining fields
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: dbName
    goName: dbName
    cli: dbName
    var: dbName
    type: string
    description: Name of the database (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: dbName
  - source: path
    name: key
    goName: key
    cli: key
    var: key
    type: string
    description: Key of the document (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 64 characters)
    resolve:
      - flag
      - prompt
    prompt: key
body:
  mode: typed
  fields:
    - field: Keys
      name: keys
      cli: keys
      var: keys
      type: '[]string'
      description: Keys to remove from the object document
      resolve:
        - flag
        - prompt
      prompt: keys
response:
  render: body
  field: JSON200
