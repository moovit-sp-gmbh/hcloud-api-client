# Generation input for `high5 spaces execution streams logs`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: GetV1OrgOrgNameSpacesSpaceNameExecutionStreamsLogsStreamLogId
command:
  path:
    - high5
    - spaces
    - execution
    - streams
    - logs
  file: spaces-execution-streams.go
  var: spacesExecutionStreamsLogsCommand
  short: Retrieve a Stream execution log by its ID
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: streamLogId
    goName: streamLogId
    cli: streamLogId
    var: streamLogId
    type: string
    resolve:
      - flag
      - prompt
    prompt: streamLogId
  - source: query
    name: payload
    goName: Payload
    cli: payload
    var: payload
    type: '*bool'
    description: Optional parameter to include the payload in the response
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: none
response:
  render: body
