# Generation input for `high5 spaces wave engine patch`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PatchV1OrgOrgNameSpacesSpaceNameWaveEngine
command:
  path:
    - high5
    - spaces
    - wave
    - engine
    - patch
  file: spaces-wave-engine.go
  var: spacesWaveEnginePatchCommand
  short: Update the default wave engine that should be used on stream execution for that space
  long: Sets the default Wave Engine version used when executing streams in this space
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Latest
      name: latest
      cli: latest
      var: latestValue
      type: '*bool'
      description: Flag to use latest engine. Will be auto updated
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Url
      name: url
      cli: url
      var: url
      type: string
      description: Url to the engine
      resolve:
        - flag
        - prompt
      prompt: url
    - field: Version
      name: version
      cli: version
      var: version
      type: string
      description: Version of the release (it should contain between 1 and 128 characters)
      resolve:
        - flag
        - prompt
      prompt: version
response:
  render: body
