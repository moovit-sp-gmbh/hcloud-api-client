# Generation input for `high5 spaces pools update`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PutV1OrgOrgNameSpacesSpaceNamePoolsPoolName
command:
  path:
    - high5
    - spaces
    - pools
    - update
  file: spaces-pools.go
  var: spacesPoolsUpdateCommand
  short: Replace an agent pool
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: poolName
    goName: poolName
    cli: poolName
    var: poolName
    type: string
    description: Name of the pool (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: poolName
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Name of the pool
      resolve:
        - flag
        - prompt
      prompt: name
    - field: Targets
      name: targets
      cli: targets
      var: targets
      type: '[]string'
      description: IDs of the targets of the pool
      resolve:
        - flag
        - prompt
      prompt: targets
response:
  render: body
  field: JSON200
