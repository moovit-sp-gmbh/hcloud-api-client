# Generation input for `high5 spaces pools create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNamePools
command:
  path:
    - high5
    - spaces
    - pools
    - create
  file: spaces-pools.go
  var: spacesPoolsCreateCommand
  short: Create a new agent pool
  long: Create a new agent pool. An agent pool is a pool of execution targets
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: query
    name: noAvatar
    goName: NoAvatar
    cli: noAvatar
    var: noAvatar
    type: '*bool'
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Name of the pool
      resolve:
        - flag
        - prompt
      prompt: name
    - field: Targets
      name: targets
      cli: targets
      var: targets
      type: '[]string'
      description: IDs of the targets of the pool
      resolve:
        - flag
        - prompt
      prompt: targets
response:
  render: body
  field: JSON201
