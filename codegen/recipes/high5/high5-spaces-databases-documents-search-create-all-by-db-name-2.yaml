# Generation input for `high5 spaces databases documents search create-all by-db-name-2`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameDatabasesDbNameDocumentsSearch
command:
  path:
    - high5
    - spaces
    - databases
    - documents
    - search
    - create-all
    - by-db-name-2
  file: spaces-databases-documents-search-create-all.go
  var: spacesDatabasesDocumentsSearchCreateAllByDbName2Command
  short: Search for documents by database name and search filter
  long: Returns a paginated list of documents in the specified database that match the given search filter. Use `limit` and `page` query parameters for pagination. The `total` response header contains the total number of matching documents regardless of pagination
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: dbName
    goName: dbName
    cli: dbName
    var: dbName
    type: string
    description: Name of the database (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: dbName
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
