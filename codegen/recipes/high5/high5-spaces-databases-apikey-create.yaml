# Generation input for `high5 spaces databases apikey create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameDatabasesDbNameApikey
command:
  path:
    - high5
    - spaces
    - databases
    - apikey
    - create
  file: spaces-databases-apikey.go
  var: spacesDatabasesApikeyCreateCommand
  short: Create a database API key
  long: Generates a new API key for a specific database within the space
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: dbName
    goName: dbName
    cli: dbName
    var: dbName
    type: string
    description: Name of the database (only alphanumeric characters, underscores, hyphens and dots are allowed; it should contain between 1 and 128 characters)
    resolve:
      - flag
      - prompt
    prompt: dbName
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Human-readable name for the API key to help identify its purpose (only alphanumeric characters, underscores and hyphens are allowed; it should contain between 3 and 64 characters)
      resolve:
        - flag
        - prompt
      prompt: name
    - field: Permission
      name: permission
      cli: permission
      var: permission
      type: ApiKeyPermission
      description: '* read - Allows read-only access to resources without making modifications * write - Allows full access to create, update, and delete resources'
      resolve:
        - flag
        - prompt
      prompt: permission
response:
  render: body
  field: JSON201
