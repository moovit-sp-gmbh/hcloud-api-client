# Generation input for `high5 execute queue`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1ExecuteQueue
command:
  path:
    - high5
    - execute
    - queue
  file: execute.go
  var: executeQueueCommand
  short: Poll the global execution queue
  long: Fetches pending queued executions across all provided organizations, dispatches each one to the calling agent via NATS and waits until all have been accepted or failed
args:
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: Blocking
      name: blocking
      cli: blocking
      var: blocking
      type: bool
      description: Whether this agent is ready to accept blocking executions
      resolve:
        - flag
        - prompt
      prompt: blocking
    - field: Limit
      name: limit
      cli: limit
      var: limit
      type: '*int'
      description: Maximum number of executions to return
      optional: true
      unset: omit
      resolve:
        - flag
    - field: OrganizationIds
      name: organizationIds
      cli: organizationIds
      var: organizationIds
      type: '[]string'
      description: IDs of the organizations to poll the queue for
      resolve:
        - flag
        - prompt
      prompt: organizationIds
response:
  render: body
