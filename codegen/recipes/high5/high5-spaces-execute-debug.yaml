# Generation input for `high5 spaces execute debug`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameExecuteExecutionIdDebug
command:
  path:
    - high5
    - spaces
    - execute
    - debug
  file: spaces-execute.go
  var: spacesExecuteDebugCommand
  short: Issue a command to the debug client of the agent executing a certain stream
  long: Sends a debug command (e.g. step, continue, replace node) via NATS to the agent currently executing a stream in debug mode, waiting up to 5 seconds for the agent to confirm receipt
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: executionId
    goName: executionId
    cli: executionId
    var: executionId
    type: string
    resolve:
      - flag
      - prompt
    prompt: executionId
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: raw
  flag: body
response:
  render: body
