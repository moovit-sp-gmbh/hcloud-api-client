# Generation input for `high5 spaces execute webhook callback`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameExecuteWebhookWebhookTokenCallbackCallbackUUID
command:
  path:
    - high5
    - spaces
    - execute
    - webhook
    - callback
  file: spaces-execute-webhook.go
  var: spacesExecuteWebhookCallbackCommand
  short: Webhook callback URL to send a non-generic response to webhook triggerer
  long: Forwards the incoming request defined the in the request body to the webhook triggerer via HTTP response
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: webhookToken
    goName: webhookToken
    cli: webhookToken
    var: webhookToken
    type: string
    description: Last path segment of the webhook URL (128 char long hex string)
    resolve:
      - flag
      - prompt
    prompt: webhookToken
  - source: path
    name: callbackUUID
    goName: callbackUUID
    cli: callbackUUID
    var: callbackUUID
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: callbackUUID
body:
  mode: raw
  flag: body
response:
  render: body
