# Generation input for `high5 spaces jobs logs search`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpacesSpaceNameJobsJobIdLogsSearch
command:
  path:
    - high5
    - spaces
    - jobs
    - logs
    - search
  file: spaces-jobs-logs.go
  var: spacesJobsLogsSearchCommand
  short: Search cronjob logs for one cron job
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: jobId
    goName: jobId
    cli: jobId
    var: jobId
    type: string
    resolve:
      - flag
      - prompt
    prompt: jobId
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
