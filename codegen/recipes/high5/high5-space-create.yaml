# Generation input for `high5 space create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: high5Client
operation: PostV1OrgOrgNameSpaces
command:
  path:
    - high5
    - space
    - create
  file: spaces.go
  var: spaceCreateCommand
  short: Create a new space in High5
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: query
    name: noAvatar
    goName: NoAvatar
    cli: noAvatar
    var: noAvatar
    type: '*bool'
    description: Skip avatar for space
    resolve:
      - flag
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: Authorization token to use in the API call
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: typed
  fields:
    - field: EnableDev
      name: enableDev
      cli: enableDev
      var: enableDev
      type: '*bool'
      description: Specifies to the front-end whether to display the versions under development of Wave Engines and Node Catalogs
      optional: true
      resolve:
        - flag
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
      resolve:
        - flag
        - context
        - prompt
      context: High5SpaceName
      persist: true
      prompt: name
response:
  render: body
  field: JSON201
  persist:
    - from: JSON201:UnderscoreId
      context: High5SpaceID
      column: high5_space_id
    - from: JSON201:Name
      context: High5SpaceName
      column: high5_space_name
