# Generation input for `cosmo spaces assets get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: GetV1OrgOrgNameSpacesSpaceNameAssetsAssetId
command:
  path:
    - cosmo
    - spaces
    - assets
    - get
  file: spaces-assets.go
  var: spacesAssetsGetCommand
  short: Fetch an asset
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: assetId
    goName: assetId
    cli: assetId
    var: assetId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: assetId
  - source: query
    name: permissions
    goName: Permissions
    cli: permissions
    var: permissions
    type: '*struct{union json.RawMessage}'
    description: Flag that indicates if the permissions for the asset should be included in the result object.
    unset: omit
    resolve:
      - flag
  - source: query
    name: namespace
    goName: Namespace
    cli: namespace
    var: namespace
    type: '*struct{union json.RawMessage}'
    description: Use * to fetch from all namespaces. Can only be used if spaceName is also defined.
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
