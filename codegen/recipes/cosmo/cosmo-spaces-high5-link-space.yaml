# Generation input for `cosmo spaces high5 link space`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PatchV1OrgOrgNameSpacesSpaceNameHigh5LinkSpace
command:
  path:
    - cosmo
    - spaces
    - high5
    - link
    - space
  file: spaces-high5-link.go
  var: spacesHigh5LinkSpaceCommand
  short: Link a high5 space to a cosmo space
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: ExecutionTarget
      name: executionTarget
      cli: executionTarget
      var: executionTarget
      type: string
      description: Email address or pool name for the execution target
      resolve:
        - flag
        - prompt
      prompt: executionTarget
    - field: High5SpaceName
      name: high5_spaceName
      cli: high5_spaceName
      var: high5Spacename
      type: string
      description: Name for the space
      resolve:
        - flag
        - context
        - prompt
      context: High5SpaceName
      prompt: high5_spaceName
response:
  render: body
  field: JSON200
