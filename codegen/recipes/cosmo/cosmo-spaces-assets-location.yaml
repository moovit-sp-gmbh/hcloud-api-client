# Generation input for `cosmo spaces assets location`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PatchV1OrgOrgNameSpacesSpaceNameAssetsAssetIdLocation
command:
  path:
    - cosmo
    - spaces
    - assets
    - location
  file: spaces-assets.go
  var: spacesAssetsLocationCommand
  short: Attach an asset to a location
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: assetId
    goName: assetId
    cli: assetId
    var: assetId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: assetId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: LocationId
      name: locationId
      cli: locationId
      var: locationId
      type: openapi_types.UUID
      description: Location ID
      resolve:
        - flag
        - prompt
      prompt: locationId
response:
  render: body
