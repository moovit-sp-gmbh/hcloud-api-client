# Generation input for `cosmo events`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: GetV1Events
command:
  path:
    - cosmo
    - events
  file: events.go
  var: eventsCommand
  short: List all available events in cosmo
args:
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
