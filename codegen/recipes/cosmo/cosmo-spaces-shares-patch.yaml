# Generation input for `cosmo spaces shares patch`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PatchV1OrgOrgNameSpacesSpaceNameSharesShareId
command:
  path:
    - cosmo
    - spaces
    - shares
    - patch
  file: spaces-shares.go
  var: spacesSharesPatchCommand
  short: Patch Share
  long: Patches the share using new values.
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: shareId
    goName: shareId
    cli: shareId
    var: shareId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: shareId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
