# Generation input for `cosmo spaces storage`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PatchV1OrgOrgNameSpacesSpaceNameStorageStorageId
command:
  path:
    - cosmo
    - spaces
    - storage
  file: spaces.go
  var: spacesStorageCommand
  short: Update space storage
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: storageId
    goName: storageId
    cli: storageId
    var: storageId
    type: string
    description: ID of the storage configuration to use for that space. If not provided, the default storage will be used. Only available if space is empty
    resolve:
      - flag
      - context
      - prompt
    context: StorageID
    persist: true
    prompt: storageId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
