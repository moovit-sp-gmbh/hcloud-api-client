# Generation input for `cosmo spaces assets thumbnail`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PostV1OrgOrgNameSpacesSpaceNameAssetsAssetIdThumbnail
command:
  path:
    - cosmo
    - spaces
    - assets
    - thumbnail
  file: spaces-assets.go
  var: spacesAssetsThumbnailCommand
  short: Get a thumbnail for a video asset at a specific timecode
  long: Returns a thumbnail image (binary) generated from the video asset at the given timecode.
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: assetId
    goName: assetId
    cli: assetId
    var: assetId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: assetId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: ThumbnailTime
      name: thumbnailTime
      cli: thumbnailTime
      var: thumbnailTime
      type: float32
      description: Time in milliseconds to grab the thumbnail from
      resolve:
        - flag
        - prompt
      prompt: thumbnailTime
response:
  render: body
