# Generation input for `cosmo spaces assets subscribe update`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PutV1OrgOrgNameSpacesSpaceNameAssetsAssetIdSubscribe
command:
  path:
    - cosmo
    - spaces
    - assets
    - subscribe
    - update
  file: spaces-assets-subscribe.go
  var: spacesAssetsSubscribeUpdateCommand
  short: Subscribe to updates for a specific asset
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: assetId
    goName: assetId
    cli: assetId
    var: assetId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: assetId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Filters
      name: filters
      cli: filters
      var: filters
      type: '*[]SubscribeDtoFilters'
      optional: true
      unset: omit
      resolve:
        - flag
      skip: true
response:
  render: body
