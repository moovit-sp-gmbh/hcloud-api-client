# Generation input for `cosmo spaces shares update`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PutV1OrgOrgNameSpacesSpaceNameSharesShareId
command:
  path:
    - cosmo
    - spaces
    - shares
    - update
  file: spaces-shares.go
  var: spacesSharesUpdateCommand
  short: Link Share
  long: Links the user to a share, making the assets shared available to the user
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: shareId
    goName: shareId
    cli: shareId
    var: shareId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: shareId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Password
      name: password
      cli: password
      var: password
      type: '*string'
      description: Share password
      optional: true
      unset: omit
      resolve:
        - flag
    - field: ShareIdHMAC
      name: shareIdHMAC
      cli: shareIdHMAC
      var: shareIdHMAC
      type: '*string'
      description: HMAC of the shareId. Required if password is not present
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
