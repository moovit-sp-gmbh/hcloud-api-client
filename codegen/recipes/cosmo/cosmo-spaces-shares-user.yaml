# Generation input for `cosmo spaces shares user`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: DeleteV1OrgOrgNameSpacesSpaceNameSharesShareIdUserUserId
command:
  path:
    - cosmo
    - spaces
    - shares
    - user
  file: spaces-shares.go
  var: spacesSharesUserCommand
  short: Sever user-share connection of another user
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: shareId
    goName: shareId
    cli: shareId
    var: shareId
    type: openapi_types.UUID
    description: ID of the share
    resolve:
      - flag
      - prompt
    prompt: shareId
  - source: path
    name: userId
    goName: userId
    cli: userId
    var: userId
    type: string
    description: ID of the user to remove from the share
    resolve:
      - flag
      - prompt
    prompt: userId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
