# Generation input for `cosmo user shares search`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PostV1UserSharesSearch
command:
  path:
    - cosmo
    - user
    - shares
    - search
  file: user-shares.go
  var: userSharesSearchCommand
  short: Search shares that a user is linked to
args:
  - source: query
    name: limit
    goName: Limit
    cli: limit
    var: limit
    type: '*float32'
    description: Page size
    unset: omit
    resolve:
      - flag
  - source: query
    name: page
    goName: Page
    cli: page
    var: page
    type: '*float32'
    description: Page index
    unset: omit
    resolve:
      - flag
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
