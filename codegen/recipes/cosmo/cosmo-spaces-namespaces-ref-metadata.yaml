# Generation input for `cosmo spaces namespaces ref metadata`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PutV1OrgOrgNameSpacesSpaceNameNamespacesNamespaceNameRefRefIdMetadata
command:
  path:
    - cosmo
    - spaces
    - namespaces
    - ref
    - metadata
  file: spaces-namespaces-ref.go
  var: spacesNamespacesRefMetadataCommand
  short: Update the metadata of a reference (e.g. Media_Asset)
  long: Replace the current metadata of a reference with a new metadata set. To add a single field one must send the current metadata set with the extra field, not just the extra field. For deleting, one must send the current metadata set without the field to be deleted.
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: namespaceName
    goName: namespaceName
    cli: namespaceName
    var: namespaceName
    type: string
    description: Name of the namespace (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - prompt
    prompt: namespaceName
  - source: path
    name: refId
    goName: refId
    cli: refId
    var: refId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: refId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
