# Generation input for `cosmo spaces shares get`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: GetV1OrgOrgNameSpacesSpaceNameSharesShareId
command:
  path:
    - cosmo
    - spaces
    - shares
    - get
  file: spaces-shares.go
  var: spacesSharesGetCommand
  short: Fetch Share
  long: Fetches a share. Response includes permissions granted by share.
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: shareId
    goName: shareId
    cli: shareId
    var: shareId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: shareId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: none
response:
  render: body
  field: JSON200
