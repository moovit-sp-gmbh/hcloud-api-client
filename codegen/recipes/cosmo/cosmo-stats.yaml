# Generation input for `cosmo stats`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: GetV1OrgOrgNameStats
command:
  path:
    - cosmo
    - stats
  file: stats.go
  var: statsCommand
  short: Retrieve usage statistics for a specific organization
  long: Provides detailed license usage metrics for a given organization
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: header
    name: authorization
    goName: Authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: params
body:
  mode: none
response:
  render: body
  field: JSON200
