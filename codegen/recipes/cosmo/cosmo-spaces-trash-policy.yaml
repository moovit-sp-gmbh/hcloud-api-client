# Generation input for `cosmo spaces trash policy`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PatchV1OrgOrgNameSpacesSpaceNameTrashPolicy
command:
  path:
    - cosmo
    - spaces
    - trash
    - policy
  file: spaces-trash.go
  var: spacesTrashPolicyCommand
  short: Update trashbin retention policy
  long: |-
    Updates the trashbin auto-delete policy for a space.

                    Rules:
                    - When `enabled = true`, `ttlDays` **must** be provided (1-365).
                    - When `enabled = false`, `ttlDays` **must not** be provided.
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: raw
  flag: body
response:
  render: body
  field: JSON200
