# Generation input for `cosmo spaces address-book teams create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PostV1OrgOrgNameSpacesSpaceNameAddressBookBookIdTeams
command:
  path:
    - cosmo
    - spaces
    - address-book
    - teams
    - create
  file: spaces-address-book-teams.go
  var: spacesAddressBookTeamsCreateCommand
  short: Add team references to an address book
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: path
    name: bookId
    goName: bookId
    cli: bookId
    var: bookId
    type: openapi_types.UUID
    resolve:
      - flag
      - prompt
    prompt: bookId
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: TeamIds
      name: teamIds
      cli: teamIds
      var: teamIds
      type: '[]string'
      description: IDs of IDP internal teams referenced by the address book
      resolve:
        - flag
        - prompt
      prompt: teamIds
response:
  render: body
  field: JSON200
