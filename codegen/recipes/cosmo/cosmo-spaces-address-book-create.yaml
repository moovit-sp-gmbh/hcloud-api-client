# Generation input for `cosmo spaces address-book create`.
# Edit and re-run `codegen regen` to regenerate the command.
client: cosmoClient
operation: PostV1OrgOrgNameSpacesSpaceNameAddressBook
command:
  path:
    - cosmo
    - spaces
    - address-book
    - create
  file: spaces-address-book.go
  var: spacesAddressBookCreateCommand
  short: Create an address book
args:
  - source: path
    name: orgName
    goName: orgName
    cli: orgName
    var: orgName
    type: string
    description: Name of the organization (only alphanumeric characters, hyphens and dots are allowed; it should contain between 3 and 64 characters)
    resolve:
      - flag
      - context
      - prompt
    context: OrgName
    persist: true
    prompt: orgName
  - source: path
    name: spaceName
    goName: spaceName
    cli: spaceName
    var: spaceName
    type: string
    description: Name of the space (only alphanumeric characters, hyphens and dots are allowed; it should contain between 1 and 32 characters)
    resolve:
      - flag
      - prompt
    prompt: spaceName
  - source: header
    name: authorization
    cli: token
    var: jwt
    type: string
    description: authorization token
    resolve:
      - flag
      - context
      - prompt
    context: Jwt
    persist: true
    prompt: authorization token
    via: editor
body:
  mode: typed
  fields:
    - field: Description
      name: description
      cli: description
      var: description
      type: '*string'
      description: Optional description
      optional: true
      unset: omit
      resolve:
        - flag
    - field: Members
      name: members
      cli: members
      var: members
      type: '*map[string]string'
      description: Members as key-value pairs (email -> optional name)
      optional: true
      unset: omit
      resolve:
        - flag
      skip: true
    - field: Name
      name: name
      cli: name
      var: name
      type: string
      description: Name of the address book
      resolve:
        - flag
        - prompt
      prompt: name
    - field: TeamIds
      name: teamIds
      cli: teamIds
      var: teamIds
      type: '*[]string'
      description: IDs of IDP internal teams referenced by the address book
      optional: true
      unset: omit
      resolve:
        - flag
response:
  render: body
  field: JSON201
